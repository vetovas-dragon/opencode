services:
  mysql:
    image: mysql:8.0
    container_name: otc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-otc_root_2026}
      MYSQL_DATABASE: otc
      MYSQL_USER: otc
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-otc_pass_2026}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-otc_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: otc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: otc-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-otc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-otc_minio_2026}
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ../backend
    container_name: otc-backend
    env_file: ../backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  celery-worker:
    build: ../backend
    container_name: otc-celery-worker
    env_file: ../backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.celery_app worker --loglevel=info

  celery-beat:
    build: ../backend
    container_name: otc-celery-beat
    env_file: ../backend/.env
    depends_on:
      redis:
        condition: service_started
    command: celery -A app.celery_app beat --loglevel=info

  frontend:
    build: ../frontend
    container_name: otc-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
  redis_data:
  minio_data:
